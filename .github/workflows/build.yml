name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt desktop runtime
        run: python -m pip install PySide6-Essentials==6.10.0
      - name: Prepare pinned signing dependency
        run: python patch_signing_dependency.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          cache-on-failure: true
      - name: Test native engine
        run: cargo test --locked --release --manifest-path engine/Cargo.toml
      - name: Build engine
        run: cargo build --locked --release --manifest-path engine/Cargo.toml
      - name: Test desktop
        run: python -m unittest discover -s tests -v
      - name: Engine self-test
        run: ./engine/target/release/rhinesign-engine.exe --self-test
      - name: Collect licenses
        run: python engine/collect_licenses.py
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Package window and corresponding source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: RhineSign-Windows-x64
          path: dist/RhineSign/
